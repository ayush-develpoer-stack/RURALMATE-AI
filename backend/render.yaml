# Render Blueprint — RuralMate AI backend (Node + Express + Prisma, run via tsx).
# This repository IS the backend, so the service root is the repo root (no rootDir).
# Production runs the TypeScript source directly with tsx — no dist/ build step.
# Prisma Client is generated by the `postinstall` hook during `npm install`.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: ruralmate-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      # PORT is injected by Render automatically — do not set it.
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: FRONTEND_URL
        sync: false
